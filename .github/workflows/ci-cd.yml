name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Tests
        working-directory: frontend
        run: npm test

  build-and-deploy:
    needs: frontend-tests
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # 3. Build Maven project in backend
      - name: Build Maven Project
        working-directory: backend
        run: |
          echo "Building Maven project..."
          mvn clean package -DskipTests
          echo "Build complete. Checking JAR file:"
          ls -la target/

      # 4. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Build Docker image (from backend directory)
      - name: Build Docker Image
        working-directory: backend
        run: |
          echo "Building Docker image from: $(pwd)"
          ls -la
          docker build -t migratemate:latest .

      # 6. Tag and push Docker image
      - name: Push Docker Image
        run: |
          docker tag migratemate:latest ${{ secrets.DOCKER_USERNAME }}/migratemate:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/migratemate:latest

      # 7. Trigger Render Deploy
      - name: Trigger Render Deploy
        run: |
          curl -X POST https://api.render.com/v1/services/srv-d5jacure5dus739nk25g/deploys \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
          -H "Content-Type: application/json"
