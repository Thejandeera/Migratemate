spring.application.name=migratemate

spring.config.import=optional:file:./local.properties


# MongoDB Configuration
spring.data.mongodb.uri=${DATASOURCE_URL}
spring.data.mongodb.database=migratemateDatabase
spring.data.mongodb.auto-index-creation=true

# Server Configuration
server.address=0.0.0.0
server.port=8080

# Frontend Configuration
frontend.url=${FRONTEND_URL}

# Spring Security
spring.security.user.name=Migratemate
spring.security.user.password=Migratemate12345


# CORS Configuration
management.endpoints.web.cors.allowed-origins=${FRONTEND_URL}
management.endpoints.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
management.endpoints.web.cors.allowed-headers=*

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AI Configuration
gemini.api.key=${GEMINI_API}


# Mail Server Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Mail Properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Application Name (for emails)
app.name=MigrateMate