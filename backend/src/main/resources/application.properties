spring.application.name=migratemate
spring.config.import=optional:classpath:.env

# --- MongoDB Configuration ---
spring.data.mongodb.uri=${DATASOURCE_URL}
spring.data.mongodb.database=migratemateDatabase
spring.data.mongodb.auto-index-creation=true

# --- Server Configuration ---
server.address=0.0.0.0
server.port=8080

# --- Frontend URL (Used for CORS) ---
frontend.url=${FRONTEND_URL}

# --- ASGARDEO CONFIGURATION (CRITICAL) ---
# Replace <YOUR_ORG_NAME> with your actual organization name
# Example: https://api.asgardeo.io/t/thejandeera/oauth2/token
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://api.asgardeo.io/t/<YOUR_ORG_NAME>/oauth2/token
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://api.asgardeo.io/t/<YOUR_ORG_NAME>/oauth2/jwks

# --- File Upload Limits ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Logging (Optional but helpful for debugging) ---
logging.level.org.springframework.security=DEBUG