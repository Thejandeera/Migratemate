spring.application.name=migratemate

spring.config.import=optional:file:./local.properties


# MongoDB Configuration
spring.data.mongodb.uri=${DATASOURCE_URL}
spring.data.mongodb.database=migratemateDatabase
spring.data.mongodb.auto-index-creation=true

# Server Configuration
server.address=0.0.0.0
server.port=8080

# Frontend Configuration
frontend.url=${FRONTEND_URL}

# Spring Security
spring.security.user.name=Migratemate
spring.security.user.password=Migratemate12345


# CORS Configuration
management.endpoints.web.cors.allowed-origins=${FRONTEND_URL}
management.endpoints.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
management.endpoints.web.cors.allowed-headers=*

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AI Configuration
gemini.api.key=AIzaSyDxWPeTjWyf85GerlDKpCCOeyNtUXqDfig

# Mail Configuration
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=true